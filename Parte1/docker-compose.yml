services:
  postgres:
    image: postgres:16-alpine
    container_name: blueprints-postgres
    environment:
      POSTGRES_DB: blueprints
      POSTGRES_USER: blueprints
      POSTGRES_PASSWORD: blueprints
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - blueprints-data:/var/lib/postgresql/data

volumes:
  blueprints-data:
