server:
  port: 8080

spring:
  application:
    name: blueprints-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blueprints}
    username: ${DB_USER:blueprints}
    password: ${DB_PASSWORD:blueprints}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
